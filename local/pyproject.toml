[project]
name = "dlt-agent-sandbox-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.13.0",
    "dagger-io>=0.20.6",
    "dlt[filesystem,parquet]>=1.25.0",
    "hotdata-dlt-destination>=0.3.0,<0.4",
    "hotdata-ibis>=0.1.3,<0.2",
    "hotdata>=0.2.3,<0.3",
    "ibis-framework>=10,<11",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.1",
    "pandas>=3.0.2",
]

[tool.black]
target-version = ["py313"]
